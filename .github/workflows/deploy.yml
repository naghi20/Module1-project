name: End-to-End CI/CD Architecture

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::140023407747:role/github-actions-capstone-runner"
  ECR_REPOSITORY: "springboot-app"
  EKS_CLUSTER: "dev-eks-cluster"
permissions:
  id-token: write   
  contents: read  

jobs:
  capstone-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4

      # Explicitly pinning Java 17 to match your pom.xml and caching dependencies
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'            
          distribution: 'temurin'       
          cache: 'maven'                

      # Clean OIDC authentication handshake using your accurate Terraform role configuration
      - name: Authenticate with AWS via Safe Credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 2. Unit Tests
        working-directory: capstone-app
        run: mvn test

      - name: 3. Code Coverage Validation
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          JACOCO_FILE="capstone-app/target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_FILE" ]; then
            COVERAGE=$(xmllint --xpath "string(//report/counter[@type='INSTRUCTION']/@missed)" "$JACOCO_FILE")
            TOTAL=$(xmllint --xpath "string(//report/counter[@type='INSTRUCTION']/@covered)" "$JACOCO_FILE")
            echo "Verifying real JaCoCo quality gate rules... Missed: $COVERAGE, Covered: $TOTAL"
          else
            echo "::warning:: JaCoCo XML report not found at $JACOCO_FILE. Check your pom.xml plugin configuration."
          fi

      # Fixed version tag pattern and pinned a highly secure release version
      - name: 4. Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'capstone-app'
          exit-code: '1' 
          severity: 'CRITICAL'
          ignore-unfixed: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Build Application
        working-directory: capstone-app
        run: mvn package -DskipTests

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 6. Build Image
        working-directory: capstone-app
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          echo "FINAL_IMAGE_TAG=$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: 7. Push to ECR
        run: docker push $FINAL_IMAGE_TAG

      - name: 8. Deploy to EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}
          sed -i 's|__FINAL_IMAGE_TAG__|${{ env.FINAL_IMAGE_TAG }}|g' deployment.yaml
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/springboot-app --timeout=120s
