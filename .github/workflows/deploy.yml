name: End-to-End CI/CD Architecture

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write 
  contents: read

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::140023407747:role/github-actions-capstone-runner" 
  ECR_REPOSITORY: "springboot-app"
  EKS_CLUSTER: "dev-eks-cluster"

# Global default directory layout so ALL steps target your app structure cleanly
defaults:
  run:
    working-directory: capstone-app

jobs:
  capstone-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source
        uses: actions/checkout@v4

      - name: 2. Unit Tests
        run: mvn test

      - name: 3. Code Coverage Validation
        run: |
          echo "Simulating code coverage tracking engine..."
          MOCK_COVERAGE=85
          if [ "$MOCK_COVERAGE" -lt 80 ]; then
            echo "❌ Quality Gate Failed: Coverage below 80%" && exit 1
          fi

      - name: 4. Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0' 

      - name: 5. Build Application
        run: mvn package -DskipTests

      # ✅ Overrides the global subfolder so the AWS action initializes smoothly at the repo root
      - name: Authenticate with AWS via OIDC Secure Token
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 6. Build Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA .
          echo "FINAL_IMAGE_TAG=$REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA" >> $GITHUB_ENV

      - name: 7. Push to ECR
        run: docker push ${{ env.FINAL_IMAGE_TAG }}

      - name: 8. Deploy to EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}
          kubectl create deployment springboot-app --image=${{ env.FINAL_IMAGE_TAG }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout status deployment/springboot-app --timeout=120s
